<text class="campo" x="64" y="1376">criado_em</text><text class="tipo" x="341" y="1376">TIMESTAMP</text>
<text class="campo" x="64" y="1404">atualizado_em</text><text class="tipo" x="341" y="1404">TIMESTAMP · atualização automática</text>
