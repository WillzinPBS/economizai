<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECONOMIZAI | Recuperar Senha</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/components/LayoutCompartilhado.js" defer></script>
  <script src="js/validation.js" defer></script>
  <script src="js/recSenha.js" defer></script>
</head>

<body>
  <economizai-header></economizai-header>

  <main class="auth-page">
    <div class="auth-card auth-card--login">
      <img src="img/logoecom.png" alt="Logo do ECONOMIZAI" class="auth-logo">
      <h1 class="auth-title">Recuperar senha</h1>

      <p class="auth-texto-auxiliar">
        Confirme seus dados para redefinir a senha da sua conta.
      </p>

      <form class="auth-form" id="recuperarSenhaForm" novalidate>
        <div class="auth-field">
          <label class="auth-label" for="login_recuperacao">
            Login <span class="auth-required" aria-hidden="true">*</span>
          </label>

          <input
            id="login_recuperacao"
            type="text"
            placeholder="Digite seu login"
            class="auth-control"
            autocomplete="username"
            minlength="4"
            maxlength="30"
            required
          >
        </div>

        <div class="auth-field">
          <label class="auth-label" for="nome_materno_recuperacao">
            Nome materno <span class="auth-required" aria-hidden="true">*</span>
          </label>

          <input
            id="nome_materno_recuperacao"
            type="text"
            placeholder="Digite o nome materno"
            class="auth-control"
            autocomplete="name"
            required
          >
        </div>

        <div class="auth-field">
          <label class="auth-label" for="nova_senha_recuperacao">
            Nova senha <span class="auth-required" aria-hidden="true">*</span>
          </label>

          <input
            id="nova_senha_recuperacao"
            type="password"
            placeholder="Digite a nova senha"
            class="auth-control"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <p id="forca-senha-recuperacao" class="auth-forca-senha" aria-live="polite"></p>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="confirma_senha_recuperacao">
            Confirmar nova senha <span class="auth-required" aria-hidden="true">*</span>
          </label>

          <input
            id="confirma_senha_recuperacao"
            type="password"
            placeholder="Repita a nova senha"
            class="auth-control"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <p id="mensagem-recuperacao" class="auth-message"></p>

        <button class="botao-principal auth-submit" type="submit">
          Redefinir senha
        </button>
      </form>

      <p class="auth-switch">
        Lembrou da senha?
        <a href="login.html" class="auth-link">
          Voltar para login
        </a>
      </p>
    </div>
  </main>

  <economizai-footer></economizai-footer>
</body>
</html>
