<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECONOMIZAI | Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/4620774d96.js"></script>
  <script src="js/components/LayoutCompartilhado.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="js/validation.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>

<body>
  <economizai-header></economizai-header>

  <main class="auth-page">
    <span class="auth-blob auth-blob--1" aria-hidden="true"></span>
    <span class="auth-blob auth-blob--2" aria-hidden="true"></span>
    <span class="auth-blob auth-blob--3" aria-hidden="true"></span>
    <span class="auth-blob auth-blob--4" aria-hidden="true"></span>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="auth-field">
          <label class="auth-label" for="login">
            Usuario <span class="auth-required" aria-hidden="true">*</span>
          </label>

          <input
            id="login"
            type="text"
            placeholder="Digite seu usuario"
            class="auth-control"
            autocomplete="username"
            minlength="4"
            maxlength="30"
            required
          >
        </div>
      </section>

        <div class="auth-field">
          <label class="auth-label" for="senha">
            Senha <span class="auth-required" aria-hidden="true">*</span>
          </label>

          <input
            id="senha"
            type="password"
            placeholder="Digite sua senha"
            class="auth-control"
            autocomplete="current-password"
            minlength="8"
            required
          >
        </div>

            <div class="auth-control-wrap">
              <i class="auth-control-icone fa-solid fa-user" aria-hidden="true"></i>
              <input
                id="login"
                type="text"
                placeholder="Digite seu usuario"
                class="auth-control auth-control--icone"
                autocomplete="username"
                minlength="4"
                maxlength="30"
                required
              >
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="senha">
              Senha <span class="auth-required" aria-hidden="true">*</span>
            </label>

            <div class="auth-control-wrap">
              <i class="auth-control-icone fa-solid fa-lock" aria-hidden="true"></i>
              <input
                id="senha"
                type="password"
                placeholder="Digite sua senha"
                class="auth-control auth-control--icone"
                autocomplete="current-password"
                minlength="8"
                required
                style="padding-right: 2.4rem;"
              >
              <button type="button" class="auth-toggle-senha" data-alvo="senha" aria-label="Mostrar senha">
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="auth-opcoes-login">
            <label class="auth-caixa-selecao">
              <input type="checkbox" id="lembrar_usuario">
              <span>Lembrar de mim</span>
            </label>

      <p class="auth-switch">
        Nao tem conta?
        <a href="cadastro.html" class="auth-link">
          Cadastrar novo usuario
        </a>
      </p>
    </div>
  </main>

  <economizai-footer></economizai-footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const form = document.getElementById("loginForm");

      preencherLoginLembrado();

      if (form) {
        form.addEventListener("submit", function(event) {
          event.preventDefault();
          login();
        });
      }

      document.querySelectorAll(".auth-toggle-senha").forEach(function(botao) {
        botao.addEventListener("click", function() {
          const alvo = document.getElementById(botao.dataset.alvo);
          if (!alvo) return;
          const visivel = alvo.type === "text";
          alvo.type = visivel ? "password" : "text";
          botao.querySelector("i").className = visivel ? "fa-solid fa-eye" : "fa-solid fa-eye-slash";
          botao.setAttribute("aria-label", visivel ? "Mostrar senha" : "Ocultar senha");
        });
      });
    });
  </script>
</body>
</html>
