<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2110" role="img" aria-labelledby="titulo resumo-diagrama">
<title id="titulo">Economizai — modelo do banco de dados MySQL</title>
<desc id="resumo-diagrama">Sete tabelas: usuarios, logs_autenticacao, produtos, ofertas, promocoes, curtidas e migracoes. Usuários podem curtir produtos publicados uma vez por produto. As curtidas são removidas ao excluir o usuário ou o produto. Produtos possuem ofertas por mercado e promoções registram as solicitações de publicação e revisão.</desc>
<defs><style>
.titulo{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
.subtitulo{font:21px 'Segoe UI',Arial,sans-serif;fill:#475569}
.tabela{fill:#fff;stroke:#cbd5e1;stroke-width:2}
.cabecalho{fill:#166534}
.entidade{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#fff}
.campo{font:19px Consolas,monospace;fill:#0f172a}
.tipo{font:18px Consolas,monospace;fill:#475569}
.chave{fill:#166534;font-weight:700}
.nota{font:20px 'Segoe UI',Arial,sans-serif;fill:#334155}
.relacao{fill:none;stroke:#15803d;stroke-width:3}
.cardinalidade{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#166534}
</style><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#15803d" stroke-width="1.5"/></marker></defs>
<rect width="1800" height="2110" rx="16" fill="#f8fafc"/>
<text class="titulo" x="40" y="58">Modelo do banco de dados</text>
<text class="subtitulo" x="40" y="94">Economizai · MySQL · Catálogo, preços, curtidas, aprovação e autenticação</text>
