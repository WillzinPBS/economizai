<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECONOMIZAI | Cadastro</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/components/LayoutCompartilhado.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>

<body>
  <economizai-header></economizai-header>

  <main class="w-full bg-gradient-to-b from-emerald-50 to-green-100">
    <div class="bg-white/95 border border-emerald-200 p-10 rounded-2xl shadow-xl w-full max-w-4xl">
      <img src="img/logoecom.png" alt="Logo do ECONOMIZAI" class="w-32 h-auto mx-auto mb-4">
      <h1 class="text-3xl font-bold text-center text-emerald-900 mb-6">
        Criar Conta
      </h1>

      <form onsubmit="cadastrar(); return false;">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="nome">
            Nome
            </label>

            <input
              type="text"
              placeholder="Digite seu nome completo"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="nome"
              autocomplete="name"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="data_nascimento">
              Data de Nascimento
            </label>

            <input
              type="date"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="data_nascimento"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="sexo">
              Sexo
            </label>

            <select
              id="sexo"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
            >
              <option value="">Selecione</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="nome_materno">
              Nome Materno
            </label>

            <input
              type="text"
              placeholder="Digite o nome materno"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="nome_materno"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="cpf">
              CPF
            </label>

            <input
              type="text"
              placeholder="Digite seu CPF"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="cpf"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="telefone_celular">
              Telefone Celular
            </label>

            <input
              type="text"
              placeholder="(+55)XX-XXXXXXXXX"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="telefone_celular"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="telefone_fixo">
              Telefone Fixo
            </label>

            <input
              type="text"
              placeholder="(+55)XX-XXXXXXXXX"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="telefone_fixo"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="login">
              Login
            </label>

            <input
              type="text"
              placeholder="Exatamente 6 letras"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="login"
              autocomplete="username"
            >
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="endereco">
              Endereco Completo
            </label>

            <input
              type="text"
              placeholder="Digite seu endereco completo"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="endereco"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="senha">
              Senha
            </label>

            <input
              type="password"
              placeholder="Exatamente 8 letras"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="senha"
              autocomplete="new-password"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-emerald-900 mb-1" for="confirma_senha">
              Confirma Senha
            </label>

            <input
              type="password"
              placeholder="Repita a senha"
              class="w-full border border-emerald-200 rounded-lg px-3 py-2 bg-emerald-50/40 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              id="confirma_senha"
              autocomplete="new-password"
            >
          </div>
        </div>

        <p id="mensagem-auth" class="text-sm mb-3 mt-4"></p>

        <button class="botao-principal !bg-emerald-600 hover:!bg-emerald-700 !rounded-lg !py-2.5 !font-semibold" type="submit">
          Enviar
        </button>
      </form>

      <p class="text-sm text-center mt-4">
        Ja tem conta?
        <a href="login.html" class="text-emerald-700 font-medium hover:text-emerald-900 hover:underline">
          Fazer login
        </a>
      </p>
    </div>
  </main>

  <economizai-footer></economizai-footer>
</body>
</html>
