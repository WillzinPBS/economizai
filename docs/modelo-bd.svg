<g class="cardinalidade">
<text x="729" y="236">0..N</text><text x="705" y="574">autor 1:N</text>
<text x="698" y="939">revisor 1:N</text><text x="705" y="1065">1:N</text>
<text x="830" y="1194">1:N</text><text x="45" y="1496">usuário 1:N</text>
<text x="798" y="1625">1:N</text>
</g>
<text class="nota" x="40" y="1466">UNIQUE produtos: (chave_nome, categoria).</text>
<text class="nota" x="900" y="1440">UNIQUE ofertas: (produto_id, chave_mercado).</text>
<text class="nota" x="40" y="1730">PK curtidas: (usuario_id, produto_id).</text>
<text class="nota" x="40" y="1763">Uma curtida por usuário em cada produto.</text>
<text class="nota" x="40" y="1796">Índice por produto_id para consultar a contagem.</text>
<rect x="900" y="1710" width="850" height="116" rx="12" fill="#dcfce7"/>
<text class="nota" x="924" y="1745" font-weight="700">Catálogo publicado e curtidas</text>
<text class="nota" x="924" y="1778">Produtos, ofertas e curtidas são lidos do MySQL.</text>
<text class="nota" x="924" y="1811">Somente usuários autenticados podem curtir.</text>
<text class="nota" x="40" y="1880">PK: chave primária · FK: chave estrangeira · UNIQUE: valor único · NULL: campo opcional.</text>
<text class="nota" x="40" y="1916">Excluir produto apaga ofertas e curtidas (CASCADE); o histórico da promoção mantém produto_id nulo.</text>
<text class="nota" x="40" y="1952">Excluir usuário apaga suas solicitações e curtidas; logs e referências ao revisor usam SET NULL.</text>
<text class="nota" x="40" y="1988">curtidas relaciona usuários e produtos (N:N); a chave composta impede duplicidade.</text>
<text class="nota" x="40" y="2024">migracoes preserva o registro das importações já aplicadas.</text>
<text class="subtitulo" x="40" y="2072">Estrutura correspondente a banco/economizai.sql. Produtos existentes são preservados nas atualizações.</text>
</svg>
