<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECONOMIZAI</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://kit.fontawesome.com/4620774d96.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/components/BotaoPrincipal.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <header>
        <div class="menu">
                <img src="img/logoecom.png">
            <nav>
                <a href="index.html">Home</a>
                <a href="produto.html" id="visitando">Produtos</a>
                <a href="">Como Funciona</a>
                <a href="">Contato</a>
            </nav>
            <div class="login">
                <!-- <a href="" id="entrar"><i class="fa-regular fa-user" style="color: rgb(255, 255, 255);"></i> Entrar</a> -->
            <div>
                <botao-principal
                  label="Entrar"
                  icon="user"
                ></botao-principal>
            </div>
            </div>
        </div>
    </header>

    <main>
        
        <div class="container">
            <h1 class="mt-3">Produtos Disponíveis</h1>

            <div class="input-group pesquisa mt-3 mb-3">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" placeholder="Buscar produtos...">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">

                <i class="bi bi-funnel fs-4 text-secondary me-3"></i>

                <div class="d-flex gap-2 flex-wrap">
                
                <button class="btn btn-primary rounded-pill px-3 py-1 fw-medium btn-sm">
                    Todas
                </button>
                
                <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                    Bebidas
                </button>
                
                <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                    Alimentos Básicos
                </button>
                
                <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                    Laticínios
                </button>
                
                <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                    Higiene
                </button>
                
                <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                    Limpeza
                </button>
                
                <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                    Carnes
                </button>
                
                <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                    Frutas
                </button>
                
                <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                    Verduras
                </button>
                
            </div>

        </div>

            <div class="produtos">
                <div class="item">
                    <div class="imagem">
                        <span>Menor preço</span>
                    </div>

                    <div class="descricao">
                        <p>Bebidas</p>
                        <h1>Coca-Cola 2L</h1>
                        <div class="precificacao">
                            <div class="precos">
                                <h2 id="preco">R$7.99</h2>
                                <p id="tipo">por unidade</p>
                            </div>
                            
                            <p id="mercado">🏭 Atacadão</p>
                        </div>
                        <div id="comprar">
                            <botao-principal
                            label="Adicionar"
                            icon="soma"
                            width="100%"
                            margin="0 0 12px 0">
                            </botao-principal>
                        </div>
                        <hr>
                        <div>Outros mercados:</div>
                        <div class="outros-mercados">
                            <div id="outro">
                                <div>🛒Carrefour</div>
                                <div>R$ 8.99</div>
                            </div>
                            <div id="outro">
                                <div>🏪Extra</div>
                                <div>R$ 9.29</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div>
            <span>© 2026 Compara Preço - Projeto Acadêmico - Encontre os melhores preços para sua lista de compras</span>
        </div>
    </footer>
</body>
</html>
