<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECONOMIZAI | Cadastro</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/components/LayoutCompartilhado.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>

<body>
  <economizai-header></economizai-header>

  <main class="w-full">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
      <h1 class="text-2xl font-bold text-center mb-6">
        Criar conta
      </h1>

      <form onsubmit="cadastrar(); return false;">
        <div class="mb-4">
          <label class="block text-sm mb-1" for="user">
            Nome
          </label>

          <input
            type="text"
            placeholder="Digite seu nome"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:border-green-600"
            id="user"
            autocomplete="name"
          >
        </div>

        <div class="mb-4">
          <label class="block text-sm mb-1" for="email">
            E-mail
          </label>

          <input
            type="email"
            placeholder="Digite seu e-mail"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:border-green-600"
            id="email"
            autocomplete="email"
          >
        </div>

        <div class="mb-4">
          <label class="block text-sm mb-1" for="senha">
            Senha
          </label>

          <input
            type="password"
            placeholder="Crie uma senha"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:border-green-600"
            id="senha"
            autocomplete="new-password"
          >
        </div>

        <div class="mb-6">
          <label class="block text-sm mb-1" for="confirma_senha">
            Confirmar Senha
          </label>

          <input
            type="password"
            placeholder="Confirme sua senha"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:border-green-600"
            id="confirma_senha"
            autocomplete="new-password"
          >
        </div>

        <p id="erro" class="text-red-500 text-sm mb-3"></p>

        <button class="botao-principal" type="submit">
          Cadastrar
        </button>
      </form>

      <p class="text-sm text-center mt-4">
        Já tem conta?
        <a href="login.html" class="text-green-600 hover:underline">
          Fazer login
        </a>
      </p>
    </div>
  </main>

  <economizai-footer></economizai-footer>
</body>
</html>
