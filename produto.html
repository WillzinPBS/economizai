<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECONOMIZAI | Produtos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/produto.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="https://kit.fontawesome.com/4620774d96.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/components/LayoutCompartilhado.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <economizai-header active-page="produtos"></economizai-header>

    <!-- Toast Notification -->

    <main class="produtos-conteudo py-4">
        <section class="produtos-pagina mb-5">
            <h1 class="mt-3">Produtos disponíveis</h1>

            <div class="input-group pesquisa mt-3 mb-3">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" id="busca-produtos" class="form-control" autocomplete="off" placeholder="Buscar produtos..." aria-label="Buscar produtos">
            </div>

            <div class="d-flex align-items-center mb-3">

                <i class="bi bi-funnel fs-4 text-secondary me-3"></i>

                <div class="produtos-filtros d-flex gap-2 flex-wrap" id="filtro">
                    <button class="btn btn-primary rounded-pill px-3 py-1 fw-medium btn-sm bg-green-600" id="fil-todas" type="button">
                        Todas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-carnes" type="button">Carnes</button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-bebidas" type="button">
                        Bebidas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-basicos" type="button">
                        Alimentos B&aacute;sicos
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-laticinios" type="button">
                        Latic&iacute;nios
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-massas" type="button">
                        Massas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-mercearia" type="button">
                        Mercearia
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-frutas" type="button">
                        Frutas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-verduras" type="button">
                        Verduras
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-limpeza" type="button">
                        Limpeza
                    </button>
                </div>
            </div>

            <p class="produtos-contador" id="produtos-contador"></p>
            <p class="auth-message auth-message--erro" id="mensagem-curtidas" role="status" aria-live="polite"></p>
            <div class="produtos" id="produtos"></div>
            <div class="invisiveis" id="invisiveis"></div>

        <section class="carrinho" aria-labelledby="carrinho-titulo">
            <div class="carrinho-cabecalho">
                <h2 id="carrinho-titulo">Seu Carrinho</h2>
                <span id="contador-carrinho" class="carrinho-contador">0 itens</span>
            </div>

            <div class="carrinho-corpo">
                <div id="lista-carrinho" class="carrinho-lista"></div>

                <aside id="resumo-carrinho" class="carrinho-resumo d-none" aria-label="Resumo e compara&ccedil;&atilde;o de mercados">
                    <section id="resultado-comparacao" class="d-none" aria-live="polite"></section>
                </aside>
            </div>
        </section>

</section>

    </main>

    <economizai-footer></economizai-footer>
<script src="js/comparacao-precos.js" defer></script>
<script src="js/produtos.js" defer></script>




</body>
</html>
