    <title>ECONOMIZAI | Produtos</title>

    <script src="js/auth.js"></script>
    <script src="https://kit.fontawesome.com/4620774d96.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/components/LayoutCompartilhado.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
    <economizai-header active-page="produtos"></economizai-header>

    <!-- Toast Notification -->

    <main class="produtos-conteudo py-4">
        <section class="produtos-pagina mb-5">
            <h1 class="mt-3">Produtos disponíveis</h1>

            <div class="input-group pesquisa mt-3 mb-3">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" placeholder="Buscar produtos...">
            </div>

            <div class="d-flex align-items-center mb-3">

                <i class="bi bi-funnel fs-4 text-secondary me-3"></i>

                <div class="produtos-filtros d-flex gap-2 flex-wrap" id="filtro">
                    <button class="btn btn-primary rounded-pill px-3 py-1 fw-medium btn-sm bg-green-600" id="fil-todas" type="button">
                        Todas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-bebidas" type="button">
                        Bebidas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-basicos" type="button">
                        Alimentos B&aacute;sicos
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-laticinios" type="button">
                        Latic&iacute;nios
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-massas" type="button">
                        Massas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-mercearia" type="button">
                        Mercearia
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-frutas" type="button">
                        Frutas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-verduras" type="button">
                        Verduras
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm" id="fil-limpeza" type="button">
                        Limpeza
                    </button>
                </div>
            </div>

            <p class="produtos-contador" id="produtos-contador"></p>
            <div class="produtos" id="produtos"></div>
            <div class="invisiveis" id="invisiveis"></div>

        <section class="container-cart">
            <h1>Seu Carrinho</h1>
            <div id="decoration"></div>
        </section>
        <p id="contador-carrinho">0 itens</p>

        <div id="lista-carrinho"></div>

        <div id="resumo-carrinho" class="mt-4 d-none">

            <hr>

            <div class="d-flex justify-content-between mb-2">
                <span>Total pelos menores pre&ccedil;os</span>
                <strong id="total-carrinho">
                    R$ 0,00
                </strong>
            </div>

            <section id="resultado-comparacao" class="mt-4 d-none" aria-live="polite"></section>

        </div>

</section>

    </main>

    <economizai-footer></economizai-footer>
