<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./JS/auth.js"></script>

</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-96">

    <h1 class="text-2xl font-bold text-center mb-6">
      Criar Conta
    </h1>

    <form onsubmit="cadastrar(); return false;">

      <div class="mb-4">
        <label class="block text-sm mb-1">
          Nome
        </label>

        <input
          type="text"
          placeholder="Digite seu nome"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:border-blue-500"
          id="user"
        >
      </div>

      <div class="mb-4">
        <label class="block text-sm mb-1">
          Email
        </label>

        <input
          type="email"
          placeholder="Digite seu email"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:border-blue-500"
          id="email"
        >
      </div>

      <div class="mb-4">
        <label class="block text-sm mb-1">
          Senha
        </label>

        <input
          type="password"
          placeholder="Crie uma senha"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:border-blue-500"
          id="senha"
        >
      </div>

      <div class="mb-6">
        <label class="block text-sm mb-1">
          Confirmar Senha
        </label>

        <input
          type="password"
          placeholder="Confirme sua senha"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:border-blue-500"
          id="confirma_senha"
        >
      </div>

      <p id="erro" class="text-red-500 text-sm mb-3"></p>

      <button
        type="submit"
        class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600 transition"
      >
        Cadastrar
      </button>

    </form>

    <p class="text-sm text-center mt-4">
      Já tem conta?
      <a href="login.html" class="text-blue-500 hover:underline">
        Fazer login
      </a>
    </p>

  </div>

</body>
</html>
