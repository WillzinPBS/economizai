<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECONOMIZAI | Alteração de senha</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="js/api.js" defer></script>
  <script src="js/components/LayoutCompartilhado.js" defer></script>
  <script src="js/recSenha.js" defer></script>
</head>
<body>
  <economizai-header></economizai-header>
  <main class="auth-page">
    <div class="auth-card auth-card--login">
      <img src="img/logoecom.png" alt="Logo do ECONOMIZAI" class="auth-logo">
      <h1 class="auth-title">Alteração de senha</h1>
      <p class="auth-texto-auxiliar" id="orientacao-senha">Entre com seu login e senha, confirme o segundo fator e abra Configurações para alterar sua própria senha. Se você esqueceu a senha, procure a equipe responsável pelo sistema.</p>
      <a class="botao-principal auth-submit" id="link-alterar-senha" href="login.html">Voltar para login</a>
      <p class="auth-switch"><a href="index.html" class="auth-link">Voltar ao início</a></p>
    </div>
  </main>
  <economizai-footer></economizai-footer>
</body>
</html>
