<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECONOMIZAI | Produtos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/produto.css">
    <script src="https://kit.fontawesome.com/4620774d96.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/components/LayoutCompartilhado.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <economizai-header active-page="produtos"></economizai-header>

    <main class="produtos-conteudo py-4">
        <section class="produtos-pagina mb-5">
            <h1 class="mt-3">Produtos disponíveis</h1>

            <div class="input-group pesquisa mt-3 mb-3">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" placeholder="Buscar produtos...">
            </div>

            <div class="d-flex align-items-center mb-3">

                <i class="bi bi-funnel fs-4 text-secondary me-3"></i>

                <div class="produtos-filtros d-flex gap-2 flex-wrap">
                    <button class="btn btn-primary rounded-pill px-3 py-1 fw-medium btn-sm bg-green-600">
                        Todas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                        Bebidas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                        Alimentos B&aacute;sicos
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                        Latic&iacute;nios
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                        Higiene
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                        Limpeza
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                        Carnes
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                        Frutas
                    </button>

                    <button class="btn btn-light rounded-pill px-3 py-1 fw-medium text-dark btn-sm">
                        Verduras
                    </button>
                </div>
            </div>

            <p class="produtos-contador" id="produtos-contador"></p>
            <div class="produtos" id="produtos"></div>

            <hr class="my-5 text-muted opacity-25"> 
    <section class="carrinho-secao">
    <div class="card border-0 shadow-sm p-4 carrinho">

        <div class="d-flex align-items-center mb-4">
            <i class="bi bi-cart3 fs-3 text-success me-2"></i>
            <h4 class="fw-bold mb-0 me-2">Minha Lista de Compras</h4>

            <span
                id="contador-carrinho"
                class="badge rounded-pill bg-success px-3">
                0 itens
            </span>
        </div>

        <div id="lista-carrinho">
           
        </div>

        <div id="resumo-carrinho" class="mt-4 d-none">

            <hr>

            <div class="d-flex justify-content-between mb-2">
                <span>Total estimado</span>
                <strong id="total-carrinho">
                    R$ 0,00
                </strong>
            </div>

            <button
                id="btn-comparar"
                class="btn btn-success w-100 mt-3">
                Comparar Mercados
            </button>

            <section
                id="resultado-comparacao"
                class="mt-4 d-none">
            </section>

        </div>

    </div>
</section>

    </main>

    

    <economizai-footer></economizai-footer>
</body>

</html>
