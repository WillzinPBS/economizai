<text class="campo" x="814" y="868">status</text><text class="tipo" x="1203" y="868">ENUM(pendente, aprovada, rejeitada)</text>
<text class="campo" x="814" y="896">criado_em</text><text class="tipo" x="1203" y="896">TIMESTAMP</text>
<text class="campo" x="814" y="924">revisado_em</text><text class="tipo" x="1203" y="924">DATETIME · NULL</text>
<text class="campo chave" x="814" y="952">revisado_por</text><text class="tipo" x="1203" y="952">INT UNSIGNED · FK · NULL</text>
</g>
