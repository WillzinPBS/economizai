<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ECONOMIZAI | PÁGINA NÃO ENCONTRADA</title>

  <script>
    (function () {
      var RAIZ_DO_SITE = "index.html";
      if (location.protocol === "http:" || location.protocol === "https:") {
        var base = document.createElement("base");
        base.href = RAIZ_DO_SITE;
        document.head.appendChild(base);
      }
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/erro404.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="js/components/LayoutCompartilhado.js" defer></script>
</head>

<body>
  <economizai-header active-page="404"></economizai-header>

  <main class="erro-pagina">
    <span class="auth-blob auth-blob--1" aria-hidden="true"></span>
    <span class="auth-blob auth-blob--2" aria-hidden="true"></span>
    <span class="auth-blob auth-blob--3" aria-hidden="true"></span>
    <span class="auth-blob auth-blob--4" aria-hidden="true"></span>

    <section class="auth-card erro-card" aria-labelledby="erro-titulo">
      <div class="erro-ilustracao" aria-hidden="true">
        <span class="erro-numero">4</span>
        <span class="erro-carrinho flutuando"><i class="bi bi-cart-x"></i></span>
        <span class="erro-numero">4</span>
      </div>

      <h1 class="erro-titulo" id="erro-titulo">Página não encontrada</h1>
      <p class="erro-texto">
        O endereço que você tentou abrir não existe ou mudou de lugar.
        Volte ao início ou siga por um destes caminhos.
      </p>

      <p class="erro-caminho" id="erro-caminho" hidden></p>

      <div class="erro-acoes">
        <a class="botao-principal botao-principal-inline erro-botao-principal" href="index.html">
          <i class="bi bi-house" aria-hidden="true"></i>
          <span>Voltar ao início</span>
        </a>

        <button class="erro-botao" id="erro-voltar" type="button" hidden>
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          <span>Página anterior</span>
        </button>
      </div>

      <nav class="erro-links" aria-label="Páginas principais">
        <span class="erro-links-rotulo">Ir para:</span>
        <a href="produto.html"><i class="bi bi-basket" aria-hidden="true"></i> Produtos</a>
        <a href="contato.html"><i class="bi bi-envelope" aria-hidden="true"></i> Contato</a>
      </nav>
    </section>
  </main>

  <economizai-footer></economizai-footer>
</body>

</html>
