<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECONOMIZAI | Produtos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/produto.css">
    <script src="https://kit.fontawesome.com/4620774d96.js"></script>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script src="js/components/LayoutCompartilhado.js" defer></script>
</head>

<body>
    <economizai-header active-page="produtos"></economizai-header>

    <main>
        <div class="container">
            <h1>Produtos Disponiveis</h1>
            <div class="produtos">
                <div class="item">
                    <div class="imagem">
                        <span>Menor preco</span>
                    </div>

                    <div class="descricao">
                        <p>Bebidas</p>
                        <h1>Coca-Cola 2L</h1>
                        <div class="precificacao">
                            <div class="precos">
                                <h2 id="preco">R$7.99</h2>
                                <p id="tipo">por unidade</p>
                            </div>

                            <p id="mercado">Atacadao</p>
                        </div>
                        <div id="comprar">
                            <button class="botao-principal">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus">
                                    <path d="M5 12h14" />
                                    <path d="M12 5v14" />
                                </svg>
                                Adicionar
                            </button>
                        </div>
                        <hr>
                        <div>Outros mercados:</div>
                        <div class="outros-mercados">
                            <div class="outro-mercado">
                                <div>Carrefour</div>
                                <div>R$ 8.99</div>
                            </div>
                            <div class="outro-mercado">
                                <div>Extra</div>
                                <div>R$ 9.29</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <economizai-footer></economizai-footer>
</body>

</html>
